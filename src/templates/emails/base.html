<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    /* Base styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    
    .email-header {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      padding: 30px 20px;
      text-align: center;
    }
    
    .logo {
      width: 150px;
      height: auto;
      margin-bottom: 15px;
    }
    
    .header-title {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    
    .email-content {
      padding: 30px 25px;
    }
    
    .email-footer {
      background-color: #f3f4f6;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }
    
    .button {
      display: inline-block;
      background-color: #0ea5e9;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      margin: 20px 0;
      transition: background-color 0.3s;
    }
    
    .button:hover {
      background-color: #0284c7;
    }
    
    .section {
      margin-bottom: 25px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      margin-top: 0;
      margin-bottom: 15px;
    }
    
    .divider {
      height: 1px;
      background-color: #e5e7eb;
      margin: 25px 0;
    }
    
    .highlight-box {
      background-color: #f0f9ff;
      border-left: 4px solid #0ea5e9;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    
    .text-center {
      text-align: center;
    }
    
    .social-links {
      margin-top: 15px;
    }
    
    .social-link {
      display: inline-block;
      margin: 0 8px;
    }
    
    .social-icon {
      width: 24px;
      height: 24px;
    }
    
    /* Responsive adjustments */
    @media only screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        border-radius: 0;
      }
      
      .email-content {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="email-header">
      <h1 class="header-title">{{headerTitle}}</h1>
    </div>
    
    <div class="email-content">
      {{> content}}
    </div>
    
    <div class="email-footer">
      <p>© {{currentYear}} All rights reserved.</p>
    </div>
  </div>
</body>
</html>
